<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Q-RESCUE | Disaster Data Entry</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #071a21;
            color: #eaf6f7;
        }


        nav {
            height: 70px;
            background: #0b2730;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            border-bottom: 1px solid #23434c;
        }


        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5ee7d0;
        }


        nav a {
            color: #c9dcdf;
            text-decoration: none;
            margin-left: 25px;
        }


        nav a:hover {
            color: #5ee7d0;
        }


        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }


        .heading {
            margin-bottom: 30px;
        }


        .small-title {
            color: #5ee7d0;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }


        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }


        .subtitle {
            color: #9db5ba;
            line-height: 1.6;
        }


        .form-card {
            background: #0c252e;
            border: 1px solid #284750;
            border-radius: 14px;
            padding: 30px;
        }


        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }


        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
        }


        .form-group.full {
            grid-column: 1 / -1;
        }


        label {
            margin-bottom: 8px;
            color: #b9ced1;
            font-size: 14px;
        }


        input,
        select {
            padding: 13px;

            border-radius: 8px;

            border: 1px solid #35545d;

            background: #071a21;

            color: white;

            outline: none;
        }


        input:focus,
        select:focus {
            border-color: #5ee7d0;
        }


        .location-box {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }


        .gps-btn {
            border: 1px solid #5ee7d0;

            background: transparent;

            color: #5ee7d0;

            padding: 0 18px;

            border-radius: 8px;

            cursor: pointer;
        }


        .gps-btn:hover {
            background: #123b42;
        }


        .coordinates {
            margin-top: 10px;

            color: #8da9ae;

            font-size: 13px;
        }


        .submit-btn {
            margin-top: 30px;

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #5ee7d0;

            color: #071a21;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .submit-btn:hover {
            opacity: 0.9;
        }


        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        #result {
            margin-top: 25px;
        }


        .success {
            background: #123b32;

            border: 1px solid #3dc7a9;

            padding: 18px;

            border-radius: 10px;

            color: #bff8eb;
        }


        .error {
            background: #3a2020;

            border: 1px solid #d96b6b;

            padding: 18px;

            border-radius: 10px;

            color: #ffd0d0;
        }


        .loading {
            background: #12323a;

            border: 1px solid #5ee7d0;

            padding: 18px;

            border-radius: 10px;

            color: #c9f8f1;
        }


        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }


            .form-group.full {
                grid-column: auto;
            }


            .location-box {
                grid-template-columns: 1fr;
            }


            .gps-btn {
                padding: 12px;
            }


            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">
        Q-RESCUE
    </div>


    <div>

        <a href="index.html">
            Home
        </a>

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="reports.html">
            Reports
        </a>

    </div>

</nav>



<div class="container">


    <div class="heading">

        <p class="small-title">
            DISASTER DATA MANAGEMENT
        </p>


        <h1>
            Disaster Data Entry
        </h1>


        <p class="subtitle">
            Enter current disaster information to support risk analysis,
            resource planning, shelter allocation and evacuation optimization.
        </p>

    </div>



    <div class="form-card">


        <h2 class="section-title">
            Emergency Information
        </h2>



        <form id="disasterForm">


            <div class="form-grid">


                <!-- DISASTER TYPE -->

                <div class="form-group">

                    <label>
                        Disaster Type
                    </label>


                    <select id="disasterType" required>

                        <option value="">
                            Select Disaster
                        </option>

                        <option value="Cyclone">
                            Cyclone
                        </option>

                        <option value="Flood">
                            Flood
                        </option>

                        <option value="Cyclone + Flood">
                            Cyclone + Flood
                        </option>

                    </select>

                </div>



                <!-- RISK LEVEL -->

                <div class="form-group">

                    <label>
                        Risk Level
                    </label>


                    <select id="riskLevel" required>

                        <option value="">
                            Select Risk
                        </option>

                        <option value="HIGH">
                            HIGH
                        </option>

                        <option value="MEDIUM">
                            MEDIUM
                        </option>

                        <option value="LOW">
                            LOW
                        </option>

                    </select>

                </div>



                <!-- LOCATION -->

                <div class="form-group full">

                    <label>
                        Location
                    </label>


                    <div class="location-box">

                        <input
                            type="text"
                            id="location"
                            placeholder="Example: Machilipatnam"
                            required
                        >


                        <button
                            type="button"
                            class="gps-btn"
                            onclick="getCurrentLocation()"
                        >
                            📍 Use Current Location
                        </button>

                    </div>


                    <div
                        id="coordinates"
                        class="coordinates"
                    >
                        Location coordinates not selected.
                    </div>

                </div>



                <!-- POPULATION -->

                <div class="form-group">

                    <label>
                        Affected Population
                    </label>


                    <input
                        type="number"
                        id="population"
                        placeholder="Example: 24500"
                        min="0"
                        required
                    >

                </div>



                <!-- FOOD -->

                <div class="form-group">

                    <label>
                        Food Packets Available
                    </label>


                    <input
                        type="number"
                        id="food"
                        placeholder="Example: 50000"
                        min="0"
                        required
                    >

                </div>



                <!-- WATER -->

                <div class="form-group">

                    <label>
                        Water Units Available
                    </label>


                    <input
                        type="number"
                        id="water"
                        placeholder="Example: 80000"
                        min="0"
                        required
                    >

                </div>



                <!-- MEDICAL -->

                <div class="form-group">

                    <label>
                        Medical Kits Available
                    </label>


                    <input
                        type="number"
                        id="medical"
                        placeholder="Example: 5000"
                        min="0"
                        required
                    >

                </div>



                <!-- RESCUE BOATS -->

                <div class="form-group">

                    <label>
                        Rescue Boats Available
                    </label>


                    <input
                        type="number"
                        id="boats"
                        placeholder="Example: 25"
                        min="0"
                        required
                    >

                </div>


            </div>



            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                🚨 Submit Disaster Data
            </button>


        </form>



        <div id="result"></div>


    </div>


</div>




<script>


/* =========================================
   Q-RESCUE LIVE BACKEND
========================================= */

const API_BASE =
    "https://q-rescue2.onrender.com";



/* =========================================
   GPS VARIABLES
========================================= */

let latitude = null;

let longitude = null;



/* =========================================
   CURRENT LOCATION
========================================= */

function getCurrentLocation() {


    const locationInput =
        document.getElementById("location");


    const coordinates =
        document.getElementById("coordinates");



    if (!navigator.geolocation) {

        alert(
            "Geolocation is not supported by this browser."
        );

        return;
    }



    locationInput.value =
        "Getting your location...";


    coordinates.innerText =
        "Getting GPS coordinates...";



    navigator.geolocation.getCurrentPosition(


        async function(position) {


            latitude =
                position.coords.latitude;


            longitude =
                position.coords.longitude;



            coordinates.innerText =
                "Latitude: " +
                latitude.toFixed(6) +
                " | Longitude: " +
                longitude.toFixed(6);



            /* REVERSE GEOCODING */

            try {


                const response =
                    await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`,
                        {
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );



                if (!response.ok) {

                    throw new Error(
                        "Reverse geocoding failed"
                    );

                }



                const data =
                    await response.json();



                if (
                    data &&
                    data.address
                ) {


                    const address =
                        data.address;



                    const fullAddress = [

                        address.house_number,

                        address.road,

                        address.neighbourhood,

                        address.suburb,

                        address.city ||
                        address.town ||
                        address.village,

                        address.state,

                        address.postcode

                    ]
                    .filter(Boolean)
                    .join(", ");



                    locationInput.value =
                        fullAddress;

                }

                else {

                    locationInput.value =
                        "Address not found";

                }


            }


            catch (error) {


                console.error(
                    "Reverse geocoding error:",
                    error
                );


                locationInput.value = "";


                alert(
                    "Unable to get the address. Please enter the location manually."
                );

            }


        },


        function(error) {


            locationInput.value = "";


            coordinates.innerText =
                "Location coordinates not selected.";



            if (
                error.code ===
                error.PERMISSION_DENIED
            ) {


                alert(
                    "Location permission denied. Please allow location access."
                );

            }


            else if (
                error.code ===
                error.POSITION_UNAVAILABLE
            ) {


                alert(
                    "Location information is unavailable."
                );

            }


            else if (
                error.code ===
                error.TIMEOUT
            ) {


                alert(
                    "Location request timed out. Please try again."
                );

            }


        }

    );

}



/* =========================================
   SUBMIT DISASTER DATA
========================================= */

document
    .getElementById("disasterForm")
    .addEventListener(
        "submit",
        async function(event) {


            event.preventDefault();



            const result =
                document.getElementById(
                    "result"
                );


            const submitBtn =
                document.getElementById(
                    "submitBtn"
                );



            /* =====================================
               COLLECT FORM DATA
            ===================================== */

            const data = {

                disaster_type:
                    document
                        .getElementById(
                            "disasterType"
                        )
                        .value,


                risk_level:
                    document
                        .getElementById(
                            "riskLevel"
                        )
                        .value,


                location:
                    document
                        .getElementById(
                            "location"
                        )
                        .value.trim(),


                latitude:
                    latitude,


                longitude:
                    longitude,


                population:
                    Number(
                        document
                            .getElementById(
                                "population"
                            )
                            .value
                    ),


                food:
                    Number(
                        document
                            .getElementById(
                                "food"
                            )
                            .value
                    ),


                water:
                    Number(
                        document
                            .getElementById(
                                "water"
                            )
                            .value
                    ),


                medical_kits:
                    Number(
                        document
                            .getElementById(
                                "medical"
                            )
                            .value
                    ),


                rescue_boats:
                    Number(
                        document
                            .getElementById(
                                "boats"
                            )
                            .value
                    )

            };



            /* =====================================
               SHOW LOADING
            ===================================== */

            result.innerHTML = `

                <div class="loading">

                    ⏳ Connecting to Q-RESCUE backend...

                    <br><br>

                    Please wait.

                </div>

            `;



            submitBtn.disabled = true;

            submitBtn.innerText =
                "⏳ Submitting Data...";



            /* =====================================
               REQUEST TIMEOUT
            ===================================== */

            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    function() {

                        controller.abort();

                    },
                    90000
                );



            try {


                /* =================================
                   SEND DATA TO RENDER BACKEND
                ================================= */

                const response =
                    await fetch(
                        API_BASE +
                        "/api/disasters",
                        {

                            method: "POST",


                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Accept":
                                    "application/json"

                            },


                            body:
                                JSON.stringify(
                                    data
                                ),


                            signal:
                                controller.signal

                        }
                    );



                clearTimeout(timeout);



                /* =================================
                   READ RESPONSE SAFELY
                ================================= */

                const responseText =
                    await response.text();


                let responseData = {};


                try {

                    responseData =
                        JSON.parse(
                            responseText
                        );

                }

                catch (jsonError) {

                    responseData = {

                        error:
                            responseText ||
                            "Invalid response from backend."

                    };

                }



                /* =================================
                   SUCCESS
                ================================= */

                if (response.ok) {


                    result.innerHTML = `

                        <div class="success">

                            <strong>
                                ✓ Disaster data submitted successfully!
                            </strong>

                            <br><br>

                            Record ID:
                            ${responseData.id ?? "N/A"}

                            <br>

                            Location:
                            ${responseData.location ?? data.location}

                            <br>

                            Risk Level:
                            ${responseData.risk_level ?? data.risk_level}

                        </div>

                    `;



                    /* RESET FORM */

                    document
                        .getElementById(
                            "disasterForm"
                        )
                        .reset();


                    latitude = null;

                    longitude = null;


                    document
                        .getElementById(
                            "coordinates"
                        )
                        .innerText =
                        "Location coordinates not selected.";

                }



                /* =================================
                   BACKEND ERROR
                ================================= */

                else {


                    result.innerHTML = `

                        <div class="error">

                            <strong>
                                ✗ Unable to submit disaster data.
                            </strong>

                            <br><br>

                            ${
                                responseData.error ||
                                `Server returned HTTP ${response.status}.`
                            }

                        </div>

                    `;

                }


            }



            /* =====================================
               REQUEST TIMEOUT
            ===================================== */

            catch (error) {


                clearTimeout(timeout);


                console.error(
                    "Submit error:",
                    error
                );



                if (
                    error.name ===
                    "AbortError"
                ) {


                    result.innerHTML = `

                        <div class="error">

                            <strong>
                                ⏱ Backend is taking too long to respond.
                            </strong>

                            <br><br>

                            The Render backend may have been sleeping.
                            Please wait a little and click
                            <strong>Submit Disaster Data</strong>
                            again.

                        </div>

                    `;

                }


                else {


                    result.innerHTML = `

                        <div class="error">

                            <strong>
                                ✗ Backend connection failed.
                            </strong>

                            <br><br>

                            Please make sure the Q-RESCUE backend is running
                            and try again.

                            <br><br>

                            Backend:
                            ${API_BASE}

                        </div>

                    `;

                }


            }



            finally {


                submitBtn.disabled = false;


                submitBtn.innerText =
                    "🚨 Submit Disaster Data";

            }


        }

    );


</script>


</body>

</html>
