<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Q-RESCUE | Disaster Data Entry</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #071a21;
            color: #eaf6f7;
        }

        nav {
            height: 70px;
            background: #0b2730;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            border-bottom: 1px solid #23434c;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #5ee7d0;
        }

        nav a {
            color: #c9dcdf;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #5ee7d0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .heading {
            margin-bottom: 30px;
        }

        .small-title {
            color: #5ee7d0;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9db5ba;
            line-height: 1.6;
        }

        .form-card {
            background: #0c252e;
            border: 1px solid #284750;
            border-radius: 14px;
            padding: 30px;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            color: #b9ced1;
            font-size: 14px;
        }

        input,
        select {
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #35545d;
            background: #071a21;
            color: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #5ee7d0;
        }

        .location-box {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }

        .gps-btn {
            border: 1px solid #5ee7d0;
            background: transparent;
            color: #5ee7d0;
            padding: 0 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .gps-btn:hover {
            background: #123b42;
        }

        .coordinates {
            margin-top: 10px;
            color: #8da9ae;
            font-size: 13px;
        }

        .submit-btn {
            margin-top: 30px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #5ee7d0;
            color: #071a21;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 25px;
        }

        .success {
            background: #123b32;
            border: 1px solid #3dc7a9;
            padding: 18px;
            border-radius: 10px;
            color: #bff8eb;
        }

        .error {
            background: #3a2020;
            border: 1px solid #d96b6b;
            padding: 18px;
            border-radius: 10px;
            color: #ffd0d0;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .location-box {
                grid-template-columns: 1fr;
            }

            .gps-btn {
                padding: 12px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Q-RESCUE</div>

    <div>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="reports.html">Reports</a>
    </div>
</nav>

<div class="container">

    <div class="heading">
        <p class="small-title">DISASTER DATA MANAGEMENT</p>

        <h1>Disaster Data Entry</h1>

        <p class="subtitle">
            Enter current disaster information to support risk analysis,
            resource planning, shelter allocation and evacuation optimization.
        </p>
    </div>

    <div class="form-card">

        <h2 class="section-title">Emergency Information</h2>

        <form id="disasterForm">

            <div class="form-grid">

                <!-- Disaster Type -->
                <div class="form-group">
                    <label>Disaster Type</label>

                    <select id="disasterType" required>
                        <option value="">Select Disaster</option>
                        <option value="Cyclone">Cyclone</option>
                        <option value="Flood">Flood</option>
                        <option value="Cyclone + Flood">Cyclone + Flood</option>
                    </select>
                </div>

                <!-- Risk -->
                <div class="form-group">
                    <label>Risk Level</label>

                    <select id="riskLevel" required>
                        <option value="">Select Risk</option>
                        <option value="HIGH">HIGH</option>
                        <option value="MEDIUM">MEDIUM</option>
                        <option value="LOW">LOW</option>
                    </select>
                </div>

                <!-- Location -->
                <div class="form-group full">
                    <label>Location</label>

                    <div class="location-box">

                        <input
                            type="text"
                            id="location"
                            placeholder="Example: Machilipatnam"
                            required
                        >

                       <button type="button" onclick="getCurrentLocation()">
    📍 Use Current Location
</button>
                    </div>

                    <div id="coordinates" class="coordinates">
                        Location coordinates not selected.
                    </div>
                </div>

                <!-- Population -->
                <div class="form-group">
                    <label>Affected Population</label>

                    <input
                        type="number"
                        id="population"
                        placeholder="Example: 24500"
                        min="0"
                        required
                    >
                </div>

                <!-- Food -->
                <div class="form-group">
                    <label>Food Packets Available</label>

                    <input
                        type="number"
                        id="food"
                        placeholder="Example: 50000"
                        min="0"
                        required
                    >
                </div>

                <!-- Water -->
                <div class="form-group">
                    <label>Water Units Available</label>

                    <input
                        type="number"
                        id="water"
                        placeholder="Example: 80000"
                        min="0"
                        required
                    >
                </div>

                <!-- Medical -->
                <div class="form-group">
                    <label>Medical Kits Available</label>

                    <input
                        type="number"
                        id="medical"
                        placeholder="Example: 5000"
                        min="0"
                        required
                    >
                </div>

                <!-- Rescue Boats -->
                <div class="form-group">
                    <label>Rescue Boats Available</label>

                    <input
                        type="number"
                        id="boats"
                        placeholder="Example: 25"
                        min="0"
                        required
                    >
                </div>

            </div>

            <button type="submit" class="submit-btn">
                🚨 Submit Disaster Data
            </button>

        </form>

        <div id="result"></div>

    </div>

</div>


<script>

let latitude = null;
let longitude = null;


/* GPS Location */

function getLocation() {

    const coordinates =
        document.getElementById("coordinates");

    if (!navigator.geolocation) {

        coordinates.innerText =
            "Geolocation is not supported by this browser.";

        return;
    }

    coordinates.innerText =
        "Getting current location...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            latitude =
                position.coords.latitude;

            longitude =
                position.coords.longitude;

            coordinates.innerText =
                "Latitude: " + latitude.toFixed(6) +
                " | Longitude: " + longitude.toFixed(6);

        },

        function(error) {

            coordinates.innerText =
                "Location permission was not granted.";

        }
    );
}


/* Submit Disaster Data */

document
    .getElementById("disasterForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const data = {

            disaster_type:
                document.getElementById("disasterType").value,

            risk_level:
                document.getElementById("riskLevel").value,

            location:
                document.getElementById("location").value,

            latitude: latitude,

            longitude: longitude,

            population:
                Number(
                    document.getElementById("population").value
                ),

            food:
                Number(
                    document.getElementById("food").value
                ),

            water:
                Number(
                    document.getElementById("water").value
                ),

            medical_kits:
                Number(
                    document.getElementById("medical").value
                ),

            rescue_boats:
                Number(
                    document.getElementById("boats").value
                )
        };


        const result =
            document.getElementById("result");

        result.innerHTML =
            "Submitting data...";


        try {

            const response = await fetch(
                "http://127.0.0.1:5000/api/disasters",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(data)
                }
            );


            const responseData =
                await response.json();


            if (response.ok) {

                result.innerHTML = `
                    <div class="success">
                        <strong>✓ Disaster data submitted successfully!</strong>
                        <br><br>
                        Record ID:
                        ${responseData.id}
                        <br>
                        Location:
                        ${responseData.location}
                        <br>
                        Risk Level:
                        ${responseData.risk_level}
                    </div>
                `;

            } else {

                result.innerHTML = `
                    <div class="error">
                        ${responseData.error}
                    </div>
                `;
            }

        }

        catch (error) {

            result.innerHTML = `
                <div class="error">
                    Backend connection failed.
                    Please make sure Flask server is running on port 5000.
                </div>
            `;

        }

    });

</script>
<script>
function getCurrentLocation() {

    const locationInput = document.getElementById("location");

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by this browser.");
        return;
    }

    locationInput.value = "Getting your location...";

    navigator.geolocation.getCurrentPosition(
        async function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            try {

                const response = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`,
                    {
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await response.json();

                if (data && data.address) {

                    const address = data.address;

                    const fullAddress = [
                        address.house_number,
                        address.road,
                        address.neighbourhood,
                        address.suburb,
                        address.city || address.town || address.village,
                        address.state,
                        address.postcode
                    ]
                    .filter(Boolean)
                    .join(", ");

                    locationInput.value = fullAddress;

                } else {
                    locationInput.value = "Address not found";
                }

            } catch (error) {

                console.error(error);
                locationInput.value = "";

                alert("Unable to get the address. Please try again.");
            }
        },

        function(error) {

            locationInput.value = "";

            if (error.code === error.PERMISSION_DENIED) {
                alert("Location permission denied. Please allow location access.");
            } 
            else if (error.code === error.POSITION_UNAVAILABLE) {
                alert("Location information is unavailable.");
            } 
            else if (error.code === error.TIMEOUT) {
                alert("Location request timed out. Please try again.");
            }
        }
    );
}
</script>
</body>
</html>
