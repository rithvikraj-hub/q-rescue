<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-RESCUE | Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #062c2b, #0b4542, #071d1d);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .signup-container {
            width: 420px;
            padding: 38px;
            background: rgba(7, 35, 34, 0.96);
            border: 1px solid rgba(0, 255, 220, 0.25);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00e6c3;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9bb8b5;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            margin-bottom: 22px;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #c7dcda;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #315957;
            border-radius: 9px;
            background: #102f2e;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #00e6c3;
            box-shadow: 0 0 8px rgba(0, 230, 195, 0.15);
        }

        .signup-btn {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: none;
            border-radius: 9px;
            background: #00c9ad;
            color: #062c2b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn:hover {
            background: #00e6c3;
            transform: translateY(-1px);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 18px;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #9bb8b5;
            font-size: 14px;
        }

        .login-text a {
            color: #00e6c3;
            text-decoration: none;
            font-weight: bold;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 16px;
        }

        .back-home a {
            color: #7fa7a3;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #00e6c3;
        }

        @media (max-width: 480px) {
            .signup-container {
                width: 95%;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">Q-RESCUE</div>

        <div class="subtitle">
            Quantum-Enabled Disaster Response System
        </div>

        <h2>Create Account</h2>

        <form id="signupForm">

            <div class="input-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="signup-btn" id="signupBtn">
                CREATE ACCOUNT
            </button>

        </form>

        <div id="message" class="message"></div>

        <div class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            const message = document.getElementById("message");
            const signupBtn = document.getElementById("signupBtn");

            // Check passwords
            if (password !== confirmPassword) {
                message.style.color = "#ff7070";
                message.textContent = "Passwords do not match.";
                return;
            }

            // Disable button while request is running
            signupBtn.disabled = true;
            signupBtn.textContent = "CREATING ACCOUNT...";
            message.style.color = "#9bb8b5";
            message.textContent = "Creating your account...";

            try {

                const response = await fetch(
                    "https://q-rescue.onrender.com/api/signup",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            full_name: name,
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok && data.success) {

                    message.style.color = "#00e6c3";
                    message.textContent = "Account created successfully!";

                    document.getElementById("signupForm").reset();

                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1200);

                } else {

                    message.style.color = "#ff7070";
                    message.textContent =
                        data.message || "Unable to create account.";

                    signupBtn.disabled = false;
                    signupBtn.textContent = "CREATE ACCOUNT";
                }

            } catch (error) {

                console.error("Signup error:", error);

                message.style.color = "#ff7070";
                message.textContent =
                    "Unable to connect to the server.";

                signupBtn.disabled = false;
                signupBtn.textContent = "CREATE ACCOUNT";
            }

        });
    </script>

</body>
</html>
